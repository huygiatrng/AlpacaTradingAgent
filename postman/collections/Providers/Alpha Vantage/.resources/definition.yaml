scripts:
  - type: http:beforeRequest
    language: text/javascript
    code: |-
      const names = ["ALPHA_VANTAGE_API_KEY"];
      const configured = names.filter(name => pm.variables.get(name));
      if (configured.length === 0) {
        console.warn('SKIPPED Alpha Vantage: credentials are not configured.');
        pm.execution.skipRequest();
      }
