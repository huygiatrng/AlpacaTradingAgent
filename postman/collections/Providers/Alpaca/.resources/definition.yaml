$kind: collection
id: a527cfa6-eebc-4a42-94ed-50741818c144
order: 2000
scripts:
  - type: http:beforeRequest
    language: text/javascript
    code: |-
      const names = ["ALPACA_API_KEY","ALPACA_SECRET_KEY"];
      const configured = names.filter(name => pm.variables.get(name));
      if (configured.length > 0 && configured.length !== names.length) throw new Error('Both Alpaca credentials are required.');
      if (configured.length === 0) {
        console.warn('SKIPPED Alpaca: credentials are not configured.');
        pm.execution.skipRequest();
      } else {
        pm.request.headers.upsert({key: 'APCA-API-KEY-ID', value: '' + pm.variables.get('ALPACA_API_KEY')});
        pm.request.headers.upsert({key: 'APCA-API-SECRET-KEY', value: '' + pm.variables.get('ALPACA_SECRET_KEY')});
      }
